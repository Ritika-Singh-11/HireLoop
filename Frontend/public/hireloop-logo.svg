<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="hl-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="hl-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="hl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container with subtle border -->
  <rect width="100" height="100" rx="24" fill="url(#hl-bg)" />
  <rect width="100" height="100" rx="24" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" />

  <!-- Ambient Glow Center -->
  <circle cx="50" cy="50" r="30" fill="url(#hl-glow)" />

  <!-- Primary Futuristic Infinity Loop -->
  <!-- Back Loop Arc -->
  <path
    d="M 50 50 C 65 30 84 32 84 50 C 84 68 65 70 50 50 C 35 30 16 32 16 50 C 16 68 35 70 50 50 Z"
    stroke="url(#hl-grad-1)"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#neon-glow)"
  />

  <!-- Top Accent Overlap Ribbon -->
  <path
    d="M 28 62 C 34 68 44 64 50 50 C 56 36 66 32 72 38"
    stroke="url(#hl-grad-2)"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- High-Tech Orbit Ring -->
  <ellipse
    cx="50"
    cy="50"
    rx="35"
    ry="14"
    transform="rotate(-25 50 50)"
    stroke="rgba(255, 255, 255, 0.2)"
    stroke-width="1.5"
    stroke-dasharray="3 4"
    fill="none"
  />

  <!-- AI Nexus Core -->
  <circle cx="50" cy="50" r="8" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
  <circle cx="50" cy="50" r="4.5" fill="#38bdf8" />
  
  <!-- Precision Quantum Sparkle at Center -->
  <polygon
    points="50,44 51.5,48.5 56,50 51.5,51.5 50,56 48.5,51.5 44,50 48.5,48.5"
    fill="#ffffff"
  />

  <!-- Satellite Nodes (Student, Recruiter, TPO) -->
  <circle cx="22" cy="42" r="2.5" fill="#38bdf8" />
  <circle cx="78" cy="58" r="2.5" fill="#f43f5e" />
  <circle cx="68" cy="34" r="2" fill="#a855f7" />
</svg>
